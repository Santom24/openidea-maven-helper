id = "fsantomero.maven-helper"
name = "Maven Helper"
version = "0.1.0"
description = "Run and debug Maven goals from the right-click menu on any module, saved goals, and a Dependency Analyzer tab on pom.xml with one-click exclusions. Inspired by Maven Helper for IntelliJ IDEA."
authors = ["Federico Santomero"]
license = "Apache-2.0"
homepage = "https://github.com/Santom24/openidea-maven-helper"
change-notes = "0.1.0 — first release: Run Maven / Debug Maven submenus on files, folders and editors (module = nearest pom.xml); goals in the Run tool window with colours; New Goal… / Saved Goals… / Remove Saved Goals…, saved goals as run configurations; Reimport; Dependency Analyzer tab on pom.xml with conflicts, tree, paths, Exclude and Jump to declaration."
categories = ["tools", "frameworks"]
# build.dependencies (the IDE's resolved Maven graph) is API 1.10.
engines.openidea = "^1.10"
icon = "icons/maven-helper.svg"
wasm = "dist/plugin.wasm"
activation = ["on-view:analyzer"]

[capabilities]
# editor.read / editor.write: the analyzer reads its pom.xml and adds <exclusion>s to it.
# project.read: find the module's pom.xml for the current file.
# build.read: the dependency graph the IDE resolved at the last Maven reload.
# storage: the last goal run (Re-run) and the saved goals.
# process:mvn: run goals (Settings › Plugins can point it at another executable, e.g. a wrapper).
required = ["editor.read", "editor.write", "project.read", "build.read", "storage", "process:mvn"]
# ide.commands: Reimport runs the IDE's "Reload All Maven Projects" action. Without it
# everything else works.
optional = ["ide.commands"]

[[contributes.customEditors]]
id = "analyzer"
title = "Dependency Analyzer"
patterns = ["pom.xml"]
priority = "default"
layout = "split"
web = "web/index.html"

