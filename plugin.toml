# The Run tool window runs goals through these configurations. The IDE asks for
# them only when one of these files is at the project root; the .openidea files
# cover a folder of modules without a pom.xml of its own.
[[contributes.runConfigurations]]
files = ["pom.xml", ".openidea/settings.toml", ".openidea/changelists.json"]

[contributes.settings]
schema = "settings.schema.json"
